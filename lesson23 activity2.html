<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>JavaScript Array Methods</h2>
    <p id="myjoin"></p>
    <p id="firstpop"></p>
    <p id="secondpop"></p>
    <script>
        var fruits =["grapes","Mango","papaya","apple"];
        document.getElementById("myjoin").innerHTML=fruits.join("*")
        document.getElementById("firstpop").innerHTML=fruits; fruits.pop();
        document.getElementById("secondpop").innerHTML=fruits; 
        </script>
</body>
</html>
